<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark glass">
            <div class="container">

                <a class="navbar-brand fw-bold" href="#">GREEN MOVE</a>

                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu">

                    <ul class="navbar-nav mx-auto text-center">
                        <li class="nav-item"><a class="nav-link text-white" href="../../index.html">Acceuil</a></li>
                        <hr>
                        <li class="nav-item"><a class="nav-link text-white" href="../../index.html#section2">Services</a></li>
                        <hr>
                        <li class="nav-item"><a class="nav-link text-white" href="../../index.html#section3">Avantages</a></li>
                        <hr>
                        <li class="nav-item"><a class="nav-link text-white" href="../../index.html#tarifs">Tarifs</a></li>
                        <hr>
                        <li class="nav-item"><a class="nav-link text-white" href="#">Contact</a></li>
                    </ul>

                    <div class="d-flex gap-2">
                        <a href="#" class="btn btn-light">Nous contacter</a>
                        <a href="page_de_connexion.html" class="btn btn-outline-light">S'inscrire</a>
                    </div>

                </div>

            </div>
        </nav>
    </header>
        <div class="bg-blur"></div>
        <div class="contact-box shadow">
            <h2 class="fw-bold text-light mb-4">Contactez-nous</h2>

            <form>
                <div class="mb-3">
                    <label class="form-label text-white">Nom</label>
                    <input type="text" class="form-control" placeholder="Votre nom">
                </div>

                <div class="mb-3">
                    <label class="form-label text-white">Email</label>
                    <input type="email" class="form-control" placeholder="greenmove.contact@mail.com">
                </div>

                <div class="mb-3">
                    <label class="form-label text-white">Numéro de téléphone</label>
                    <input type="tel" class="form-control" placeholder="Votre numéro de téléphone">
                </div>

                <div class="mb-3">
                    <label class="form-label text-white">Sujet</label>
                    <input type="text" class="form-control" placeholder="Sujet de votre message">
                </div>

                <div class="mb-3">
                    <label class="form-label text-white">Message</label>
                    <textarea class="form-control" rows="5" placeholder="Votre message... Nous vous répondions en moins de 10h"></textarea>
                </div>

                <button type="submit" class="btn btn-custom w-100 rounded-pill">
                    Envoyer
                </button>
            </form>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
