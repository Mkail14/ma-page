<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestion des produits</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <link rel="stylesheet" href="/Mes_sites_web/Gestion-de-projet/Assets/css/styles.css">
</head>

<body>

<!-- GLOW -->
<div class="bg-glow"></div>

<!-- MENU -->
<div class="menu-panel" id="menuPanel">

  <div class="section">
    <h6>Réalisations</h6>
    <a href="/index.html">Accueil</a>
    <a href="#">Projets</a>
  </div>

  <div class="section">
    <h6>À propos</h6>
    <a href="#">Moi</a>
    <a href="#">Formation</a>
  </div>

  <div class="section">
    <h6>Contact</h6>
    <a href="#">Support</a>
  </div>

  <div class="bottom-row">
    <div>Me suivre</div>
    <div class="social">
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
      <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
    </div>
  </div>

</div>

<!-- HERO -->
<section class="hero container-fluid">

  <div class="hero-top">

    <div>
      <h1>Gérez vos produits</h1>
      <p>Une plateforme moderne pour suivre stock, ventes et analyse.</p>

      <div class="hero-buttons">

        <button id="btnAjouter" class="glass-btn">
          Ajouter un produit
        </button>

        <input id="recherche" class="glass-input" type="text" placeholder="Rechercher...">

      </div>
    </div>

    <div class="stats-card glass">
      <h5>Stock global</h5>
      <h2>0</h2>
      <div class="bar"></div>
    </div>

  </div>

  <!-- TABLE + FORM -->
  <div class="row g-4 mt-5">

    <!-- TABLE -->
    <div class="col-lg-8" id="tableCol">

      <div class="glass-card">

        <table class="glass-table">

          <thead>
            <tr>
              <th>ID</th>
              <th>Nom</th>
              <th>Catégorie</th>
              <th>Prix</th>
              <th>Stock</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="tbody"></tbody>

        </table>

      </div>

    </div>

    <!-- FORM -->
    <div class="col-lg-4 d-none" id="formCol">

      <div class="glass-card">

        <h4 id="titreForm">Ajouter produit</h4>

        <form id="formProduit">

          <input id="nom" class="glass-input" placeholder="Nom">

          <select id="categorie" class="glass-input">
            <option value="">Catégorie</option>
            <option>Maison</option>
            <option>Sport</option>
          </select>

          <input id="prix" type="number" class="glass-input" placeholder="Prix">

          <input id="stock" type="number" class="glass-input" placeholder="Stock">

          <p id="message"></p>

          <div class="btn-row">

            <button type="button" id="submitBtn" class="glass-btn">
              Ajouter
            </button>

            <button type="submit" id="annuler" class="btn-secondary-custom">
              Annuler
            </button>

          </div>

        </form>

      </div>

    </div>

  </div>

</section>

<!-- NAV -->
<nav class="bottom-nav glass">

  <div>Gestion Produit</div>

  <div class="menu-icon" id="menuBtn">
    <span></span><span></span><span></span>
  </div>

</nav>

<script src="/Mes_sites_web/Gestion-de-projet/Assets/js/script.js"></script>
</body>
</html>
