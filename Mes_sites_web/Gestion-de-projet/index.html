<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Gestion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="/Mes_sites_web/Gestion-de-projet/Assets/css/styles.css"/>
</head>

<body>
  <div class="bg-glow"></div>
  <div class="menu-overlay" id="menuOverlay"></div>
   <nav class="bottom-nav">
    <div class="logo">DWWM - Mario</div>

    <div class="menu-icon" id="menuBtn">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <a href="#" class="nav-link-custom" id="navInventaire">Inventaire</a>
    <a href="#" class="nav-link-custom" id="navClients">Clients</a>

</nav>
<div class="menu-panel" id="menuPanel">
  <div class="menu-grid">
    <div class="menu-column">
      <h6>RÉALISATIONS SITES</h6>
      <a href="#" id="menuAccueil">Dashboard</a>
      <a href="#" id="menuInventaire">Inventaire</a>
      <a href="#" id="menuClients">Clients</a>
    </div>

    
    <div class="menu-column">
      <h6>DWWM</h6>
      <a href="#">Mon dossier</a>
      <a href="#">Ma formation</a>
    </div>


    <div class="menu-column">
      <h6>CONTACT</h6>
      <a href="#">Mon numéro</a>
      <a href="#">Support</a>
    </div>


    <div class="menu-social">
      <p>Me suivre</p>
      <div class="social-icons">
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
      </div>
    </div>

  </div>

</div>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-top">
      <div class="hero-left">
        <h1 id="heroTitle">Dashboard Gestion</h1>
        <p id="heroText">Gérez produits et clients dans une seule interface moderne.</p>
      </div>

    </div>

    <!-- INVENTAIRE -->
    <div id="inventaireSection" class="content-section">
      <div class="glass-card p-4 mt-5">
        <div class="top-actions">
          <h2 class="section-title">
            <i class="fas fa-boxes"></i>Inventaire</h2>

          <div class="actions-right">

            <button id="btnCharger"class="glass-btn mode-produit"><i class="fas fa-download"></i>Charger les produits </button>
            <button id="toggleProductsView" class="glass-btn mode-produit"><i class="fas fa-table"></i>Liste</button>

          </div>
        </div>

        <!-- FILTER -->
        <div class="toolbar-row">

          <input type="text" id="rechercheProduit" class="glass-input" placeholder="Rechercher un produit..." />

          <select id="filterCategorie" class="filter-select">
            <option value="">Toutes catégories</option>
          </select>

        </div>

        
        <div
          id="productsContainer"
          class="products-grid mt-4"
        ></div>

      </div>

    </div>

    <!-- CLIENTS -->
    <div id="clientsSection" class="content-section">
      <div class="glass-card p-4 mt-5">
        <div class="top-actions">
          <h2 class="section-title clients"><i class="fas fa-users"></i>Clients </h2>

          <button id="toggleClientsView" class="glass-btn mode-client">

            <i class="fas fa-table"></i>Liste</button>

        </div>

        <!-- FILTER -->
        <div class="toolbar-row">

          <input type="text" id="rechercheClient" class="glass-input" placeholder="Rechercher un client..."/>

          <select id="filterVille" class="filter-select" >
            <option value="">Toutes les villes</option>
          </select>

        </div>

        <!-- CLIENTS -->
        <div id="clientsContainer" class="products-grid mt-4"></div>

      </div>

    </div>
  </section>
  <script src="/Mes_sites_web/Gestion-de-projet/Assets/js/script.js"></script>

</body>
</html>
